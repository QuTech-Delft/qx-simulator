name: Python tests
description: Install and run tests in Python
inputs:
  shell:
    required: true
    description: Which shell to use for the `run` command
  python-version:
    required: false
    default: "3.13"
    description: Python version to test
  conan-compiler-version:
    required: false
    default: ""
    description: Optional Conan compiler version override

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Get latest CMake
      uses: lukka/get-cmake@latest
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip conan pytest setuptools wheel
      shell: ${{ inputs.shell }}
    - name: Build
      env:
        QX_CPU_COMPATIBILITY_MODE: "True"
        QX_CONAN_COMPILER_VERSION: ${{ inputs.conan-compiler-version }}
      run: python -m pip install --verbose .
      shell: ${{ inputs.shell }}
    - name: Report extension architecture
      if: runner.os == 'macOS' && runner.arch == 'X64' && inputs.python-version == '3.14'
      run: |
        python -c 'import platform, sysconfig; print("Python machine:", platform.machine()); print("Python platform:", sysconfig.get_platform())'
        find pybuild/build -type f -name '_qxelarator*.so' -exec file {} \; -exec lipo -info {} \;
      shell: ${{ inputs.shell }}
    - name: Diagnose string-based simulator tests
      if: runner.os == 'macOS' && runner.arch == 'X64' && inputs.python-version == '3.14'
      working-directory: test/qxelarator
      run: python -m pytest -k "not execute_file"
      shell: ${{ inputs.shell }}
    - name: Test
      working-directory: test/qxelarator
      run: python -m pytest
      shell: ${{ inputs.shell }}
